esphome:
  name: ssd1306i2c
  platform: esp8266
  board: nodemcu
  project:
    name: "vcj.klint-land"
    version: "1.0.0"

ota:
  - platform: esphome
    password: !secret gen_password
    port: 8266

ota:
  - platform: esphome
    password: !secret gen_password
    port: 8266

wifi:
  networks:
    - ssid: !secret wifi_ssid_1
      password: !secret gen_password
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password_2
    - ssid: !secret wifi_ssid_3
      password: !secret wifi_password_3

  ap:
    ssid: !secret wifi_ssid_ap
    password: !@secret gen_password

web_server:
  port: 80
  version: 2

logger:
  level: DEBUG

# This file is used to configure the SSD1306 OLED display

i2c:
  sda: GPIO5
  scl: GPIO4
  scan: true
  frequency: 400kHz

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    reset_pin: D0
    address: 0x3C
    contrast: 35%
    lambda: |-
      it.print(0, 0, id(font_12), " +|- Klint -|+");
      it.printf(0, 12, id(font_12), "Block: %s", id(blocked_lock) ? "ON" : "OFF");
      it.printf(0, 24, id(font_12), "Lock: %s", id(relay_output_lock) ? "ON" : "OFF");
      it.printf(0, 36, id(font_12), "Lights: %s", id(relay_output_porche_lights) ? "ON" : "OFF");
      it.printf(0, 48, id(font_12), "%.1f°C | %.1f%%", id(porche_temperature).state, id(porche_humidity).state);

font:
  - file: "font.ttf"
    id: font_12
    size: 12
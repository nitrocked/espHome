web_server:
  port: 80
  version: 2

logger:
  level: DEBUG

# api: // Descomentar para activar la API. Si activo, se reinicia a los 15min si no hay clientes

globals:
  - id: block_time
    type: int
    initial_value: "10000" # Tiempo de bloqueo en milisegundos
  - id: blocked_lock
    type: bool
    initial_value: "false"
  - id: lock_delay_time
    type: int
    initial_value: "200" # Retardo antes de activar el relé (ms)
  - id: lock_time
    type: int
    initial_value: "500" # Tiempo de activación del relé (ms)

number:
  - platform: template
    name: "Block Time (s)"
    icon: "mdi:timer"
    min_value: 5
    max_value: 60
    step: 5
    unit_of_measurement: s
    set_action:
      - lambda: |-
          id(block_time) = (int) x * 1000;

  - platform: template
    name: "Lock Delay Time (ms)"
    icon: "mdi:timer"
    min_value: 200
    max_value: 2000
    step: 100
    unit_of_measurement: ms
    set_action:
      - lambda: |-
          id(lock_delay_time) = (int) x;

  - platform: template
    name: "Lock Time (ms)"
    icon: "mdi:timer"
    min_value: 500
    max_value: 4000
    step: 500
    unit_of_measurement: ms
    set_action:
      - lambda: |-
          id(lock_time) = (int) x;

binary_sensor:
  - platform: gpio
    pin: GPIO14
    name: "24V Input"
    device_class: running
    filters:
      - delayed_on: 5ms
    on_press:
      - if:
          condition:
            lambda: return !id(blocked_lock);
          then:
            - lambda: id(blocked_lock) = true;
            - delay: !lambda "return id(lock_delay_time);"
            - switch.turn_on: relay_output_lock
            - delay: !lambda "return id(block_time);"
            - lambda: id(blocked_lock) = false;

switch:
  - platform: gpio
    pin: GPIO13
    name: "Porche Lights"
    id: relay_output_porche_lights
    inverted: true
    icon: "mdi:lightbulb"

  - platform: gpio
    pin: GPIO12
    name: "Gate Lock"
    id: relay_output_lock
    inverted: true
    icon: "mdi:gate"
    on_turn_on:
      - delay: !lambda "return id(lock_time);"
      - switch.turn_off: relay_output_lock

i2c:
  sda: GPIO5
  scl: GPIO4
  scan: true
  frequency: 400kHz

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    reset_pin: D0
    address: 0x3C
    contrast: 35%
    lambda: |-
      it.print(0, 0, id(font_12), " +|- Klint -|+");
      it.printf(0, 12, id(font_12), "Block: %s", id(blocked_lock) ? "ON" : "OFF");
      it.printf(0, 24, id(font_12), "Lock: %s", id(relay_output_lock) ? "ON" : "OFF");
      it.printf(0, 36, id(font_12), "Lights: %s", id(relay_output_porche_lights) ? "ON" : "OFF");
      it.printf(0, 48, id(font_12), "%.1f°C | %.1f%%", id(porche_temperature).state, id(porche_humidity).state);

font:
  - file: "font.ttf"
    id: font_12
    size: 12

sensor:
  - platform: dht
    model: DHT11
    pin: GPIO2
    temperature:
      name: "Porche Temperature"
      id: porche_temperature
    humidity:
      name: "Porche Humidity"
      id: porche_humidity
    update_interval: 10min

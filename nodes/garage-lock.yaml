esphome:
  name: garage-lock
  platform: esp8266
  board: nodemcu
  project:
    name: "vcj.klint-land"
    version: "1.0.0"

ota:
  - platform: esphome
    password: "MrvllVlly_2022"
    port: 8266

wifi:
  networks:
    - ssid: "KLAND_FF00"
      password: "MrvllVlly_2022"
    - ssid: "VOZPLUS_AVATEL_v2Ea"
      password: "hUmheJzG"
    - ssid: "VOZPLUS_AVATEL_5G-v2Ea"
      password: "hUmheJzG"

  ap:
    ssid: "KLAND_GRGLCK"
    password: "MrvllVlly_2022"

web_server:
  port: 80
  version: 2

logger:
  level: DEBUG

api:

globals:
  - id: relay_active
    type: bool
    initial_value: "false"
  - id: block_time
    type: int
    initial_value: "20" # Tiempo de bloqueo en segundos
  - id: lock_delay_time
    type: int
    initial_value: "200" # Retardo antes de activar el relé (ms)
  - id: lock_time
    type: int
    initial_value: "1" # Tiempo de activación del relé (s)

# Control de valores desde Home Assistant
number:
  - platform: template
    name: "Block Time (s)"
    icon: "mdi:timer"
    min_value: 5
    max_value: 60
    step: 5
    unit_of_measurement: "s"
    set_action:
      - lambda: |-
          id(block_time) = (int) x;

  - platform: template
    name: "Lock Delay Time (ms)"
    icon: "mdi:timer"
    min_value: 100
    max_value: 1000
    step: 100
    unit_of_measurement: "ms"
    set_action:
      - lambda: |-
          id(lock_delay_time) = (int) x;

  - platform: template
    name: "Lock Time (ms)"
    icon: "mdi:timer"
    min_value: 500
    max_value: 2000
    step: 250
    unit_of_measurement: "ms"
    set_action:
      - lambda: |-
          id(lock_time) = (int) x;

# Sensores
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14 # GPIO para la señal de 12V
      mode: INPUT
    name: "12/24V Input"
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition:
            - lambda: "return !id(relay_active);" # Solo si no está activo
          then:
            - logger.log: "Activating lock relay after delay"
            - delay: !lambda "return id(lock_delay_time);"
            - output.turn_off: relay_output_lock # Activo LOW
            - lambda: |-
                id(relay_active) = true;
            - delay: !lambda "return id(lock_time) * 1000;"
            - output.turn_on: relay_output_lock # Inactivo HIGH
            - logger.log: "Deactivating lock relay"
            - delay: !lambda "return id(block_time) * 1000;" # Tiempo de bloqueo
            - lambda: |-
                id(relay_active) = false;

  - platform: template
    name: "Block Status"
    id: block_time_indicator
    device_class: lock

# Salidas
output:
  - platform: gpio
    pin: GPIO12 # Cerradura
    id: relay_output_lock
    inverted: false # Activo LOW

switch:
  - platform: gpio
    name: "Porche Lights"
    pin: GPIO13 # Luz del porche
    id: relay_output_porche_lights
    inverted: false # Normal

# OLED Display
i2c:
  sda: GPIO5
  scl: GPIO4
  scan: true

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.print(0, 0, id(font_12), "Klint Land's Garage Lock");
      it.printf(0, 12, id(font_12), "Block Time: %ds", id(block_time));
      it.printf(0, 24, id(font_12), "Relay Active: %s", id(relay_active) ? "ON" : "OFF");
      it.printf(0, 36, id(font_12), "Porche Lights: %s", id(relay_output_porche_lights).state ? "ON" : "OFF");

font:
  - file: "font.ttf"
    id: font_12
    size: 12

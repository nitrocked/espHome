    password: "MrvllVlly_2022"
    port: 8266

wifi:
  networks:
    - ssid: "KLAND_FF00"
      password: "MrvllVlly_2022"
    - ssid: "VOZPLUS_AVATEL_v2Ea"
      password: "hUmheJzG"
    - ssid: "VOZPLUS_AVATEL_5G-v2Ea"
      password: "hUmheJzG"

  ap:
    ssid: "KLAND_GRGLCK"
